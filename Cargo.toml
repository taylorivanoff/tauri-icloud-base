[package]
name = "tauri-icloud-base"
version = "0.1.0"
edition = "2021"
description = "Shared Tauri 2 shell for iCloud/Apple web wrappers (cookies, Safari UA, tray)."
authors = ["Taylor Ivanoff"]
license = "MIT"
repository = "https://github.com/taylorivanoff/tauri-icloud-base"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-tray-base = { path = "../tauri-tray-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"
